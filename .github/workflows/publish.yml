name: Refresh and publish Saudi KPI dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "docs/index.html"
      - "docs/logs.html"
      - "docs/archive.html"
      - "kpi_dashboard.py"
      - "publish_static.py"
      - "requirements.txt"
      - "Saudi_16_KPI_Data_Mart.xlsx"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run dashboard tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s . -p "test_kpi_dashboard.py" -v
      - name: Refresh data and build static downloads
        env:
          KPI_REFRESH_MINUTES: "1440"
          PYTHONUTF8: "1"
        run: python publish_static.py
      - name: Commit daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/archive docs/refresh-history
          if git diff --cached --quiet; then
            echo "Today's archive already exists."
          else
            git commit -m "Archive daily KPI snapshot"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
